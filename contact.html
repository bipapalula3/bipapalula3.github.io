<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="contact_title">Contact & Feedback | YMPL</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f1115; color: #e5e7eb; line-height: 1.8; margin: 0; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; text-align: center; }
        h1 { color: #ffd966; }
        p { color: #9ca3af; margin-bottom: 30px; }
        .contact-box { background: #1a1d23; padding: 30px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        /* 설문지 이동 버튼 스타일 */
        .feedback-btn { display: inline-block; background: #10b981; color: #fff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 15px; transition: background 0.2s; }
        .feedback-btn:hover { background: #059669; }
        /* 언어 버튼 스타일 */
        .lang-switcher { display: flex; gap: 5px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .lang-switcher button { background: #1f2933; border: 1px solid #455563; color: #fff; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .lang-switcher button:hover { background: #374151; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 7개 국어 토글 버튼 -->
        <div class="lang-switcher">
            <button onclick="switchLanguage('en')">EN</button>
            <button onclick="switchLanguage('ko')">KO</button>
            <button onclick="switchLanguage('pl')">PL</button>
            <button onclick="switchLanguage('pt-BR')">PT-BR</button>
            <button onclick="switchLanguage('de')">DE</button>
            <button onclick="switchLanguage('es')">ES</button>
            <button onclick="switchLanguage('zh')">ZH</button>
        </div>

        <h1 data-i18n="contact_h1">Contact & Feedback</h1>
        <p data-i18n="contact_desc">If you want to find an artist in TIDAL K-POP FINDER, add a playlist, or have any feedback, please let us know!</p>
        
        <div class="contact-box">
            <h3 data-i18n="contact_sub">🎧 Favorite Artist Summon & Playlist Request</h3>
            <p data-i18n="contact_box_desc">Click the button below to share your thoughts or request your favorite artist's archive.</p>
            <!-- 🔗 아래 href에 구글 설문지 링크를 넣어주세요 -->
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSferitqscV6iY25mCOs7gCLybh6Kl3cOQDnJaTBSWbi1_TVpg/viewform?usp=header" 
               target="_blank" 
               class="feedback-btn" 
               data-i18n="feedback_btn_text">
                Open Feedback Form
            </a>
        </div>
        
        <p style="margin-top:40px; text-align:center;">
            <a href="https://bipapalula3.github.io/?app=1"
               data-i18n="contact_back"
               style="color: #ffd966; text-decoration: none;">
                Back to Main
            </a>
        </p>    
    </div>

    <script>
        const translations = {
            'en': {
                'contact_title': 'Contact & Feedback | YMPL', 
                'contact_h1': 'Contact / Feedback',
                'contact_desc': 'If you want to find an artist in TIDAL K-POP FINDER, add a playlist, or have any feedback, please let us know!',
                'contact_sub': 'Favorite Artist Summon & Playlist Request', 
                'contact_box_desc': 'Click the button below to share your thoughts or request your favorite artist archive.',
                'feedback_btn_text': 'Open Feedback Form',
                'contact_back': 'Back to Main'
            },
            'ko': {
                'contact_title': '문의 및 피드백 | YMPL', 
                'contact_h1': '문의하기 / 피드백',
                'contact_desc': 'TIDAL K-POP FINDER에서 찾고 싶은 아티스트나, 추가하고 싶은 플레이리스트, 혹은 개선할 점이 있다면 편하게 들려주세요!',
                'contact_sub': '최애 아티스트 소환 & 플레이리스트 신청', 
                'contact_box_desc': '아래 버튼을 눌러 좋아하는 아티스트를 신청하거나 의견을 남겨주세요.',
                'feedback_btn_text': '피드백 폼 열기',
                'contact_back': '메인으로 돌아가기'
            },
            'pl': {
                'contact_title': 'Kontakt i Opinie | YMPL', 
                'contact_h1': 'Kontakt i Opinie',
                'contact_desc': 'Jeśli chcesz znaleźć artystę w TIDAL K-POP FINDER, dodać playlistę lub masz jakieś uwagi, daj nam znać!',
                'contact_sub': 'Wezwanie artysty i prośba o playlistę', 
                'contact_box_desc': 'Kliknij poniższy przycisk, aby przesłać opinię.',
                'feedback_btn_text': 'Otwórz formularz',
                'contact_back': 'Powrót do strony głównej'
            },
            'pt-BR': {
                'contact_title': 'Contato e Feedback | YMPL', 
                'contact_h1': 'Contato e Feedback',
                'contact_desc': 'Se você quiser encontrar um artista no TIDAL K-POP FINDER, adicionar uma playlist ou tiver algum feedback, por favor nos avise!',
                'contact_sub': 'Invocação de Artista e Pedido de Playlist', 
                'contact_box_desc': 'Clique no botão abaixo para enviar seu feedback com segurança.',
                'feedback_btn_text': 'Abrir Formulário',
                'contact_back': 'Voltar ao Início'
            },
            'de': {
                'contact_title': 'Kontakt & Feedback | YMPL', 
                'contact_h1': 'Kontakt / Feedback',
                'contact_desc': 'Wenn Sie einen Künstler im TIDAL K-POP FINDER finden, eine Playlist hinzufügen oder Feedback geben möchten, lassen Sie es uns wissen!',
                'contact_sub': 'Künstler beschwören & Playlist anfordern', 
                'contact_box_desc': 'Klicken Sie auf die Schaltfläche unten, um Ihr Feedback zu senden.',
                'feedback_btn_text': 'Formular öffnen',
                'contact_back': 'Zurück zur Hauptseite'
            },
            'es': {
                'contact_title': 'Contacto y Opiniones | YMPL', 
                'contact_h1': 'Contacto y Opiniones',
                'contact_desc': 'Si desea encontrar un artista en TIDAL K-POP FINDER, agregar una lista de reproducción o tiene algún comentario, ¡háganoslo saber!',
                'contact_sub': 'Invocación de artista y solicitud de lista', 
                'contact_box_desc': 'Haga clic en el botón de abajo para enviar sus comentarios.',
                'feedback_btn_text': 'Abrir formulario',
                'contact_back': 'Volver al inicio'
            },
            'zh': {
                'contact_title': '联系与反馈 | YMPL', 
                'contact_h1': '联系与反馈',
                'contact_desc': '如果您想在 TIDAL K-POP FINDER 中寻找艺人、添加播放列表或有任何反馈，请随时告诉我们！',
                'contact_sub': '喜爱的艺人召唤与播放列表申请', 
                'contact_box_desc': '点击下方按钮，轻松提交您的想法或喜爱的艺人推荐。',
                'feedback_btn_text': '打开反馈表单',
                'contact_back': '返回主页'
            }
        };

        function switchLanguage(lang) {
            if (!translations[lang]) lang = 'en';
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    element.innerHTML = translations[lang][key];
                }
            });
            localStorage.setItem('preferredLang', lang);
        }

        function initLanguage() {
            const savedLang = localStorage.getItem('preferredLang');
            if (savedLang && translations[savedLang]) {
                switchLanguage(savedLang);
                return;
            }
            
            const fullBrowserLang = navigator.language.toLowerCase();
            const shortBrowserLang = fullBrowserLang.substring(0, 2);
            
            let selectedLang = 'en';
            if (fullBrowserLang.startsWith('pt')) {
                selectedLang = 'pt-BR';
            } else if (translations[shortBrowserLang]) {
                selectedLang = shortBrowserLang;
            }

            switchLanguage(selectedLang);
        }

        document.addEventListener('DOMContentLoaded', initLanguage);
    </script>
</body>
</html>
